# Větvový model: `main` je integrační i RELEASE větev. Testuje se z ní,
# staví se z ní image a jen z ní se do platformy hlásí kandidátský digest.
# Stejně to má každý další hostovaný konektor (`ares-mcp`, `raynet-mcp`,
# `dotykacka-mcp`, `upgates-com-mcp`) i `openmcp-sdk` a `platforma`.
#
# `dev` je LEGACY větev bez release pravomoci. Nemaže se, ale nic z ní
# nevzniká: neběží na ní CI, nestaví se image, nehlásí se digest.
#
# Proč to tu stálo za opravu: do 31. 7. 2026 tenhle soubor triggeroval jen na
# `dev`, a `dev` byla zároveň GitHub default branch zaseknutá na `b0570fd`.
# PR #3 (`chore/fix-image-build` → `main`) proto neprošel ani testy, ani
# buildem — oprava se dostala na `main`, ale image z ní nikdy nevznikl a
# platforma se o ní nedozvěděla. Autoritativní je `main` (`f655d11`).
name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

env:
  SLUG: abraflexi

concurrency: { group: "ci-${{ github.repository }}", cancel-in-progress: false }

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with: { path: "${{ env.SLUG }}" }
      - id: sdkref
        run: echo "ref=$(tr -d '[:space:]' < "${SLUG}/.sdk-ref")" >> "$GITHUB_OUTPUT"
      # `mcp-open/openmcp-sdk` je veřejný — checkout projde s výchozím
      # `github.token`. Explicitní `token:` sem nepatří: OPENMCP_CI_TOKEN
      # neexistuje, prázdná hodnota by checkout shodila na 401.
      - uses: actions/checkout@v4
        with:
          repository: mcp-open/openmcp-sdk
          ref: ${{ steps.sdkref.outputs.ref }}
          path: sdk
      - name: Lint, typecheck, manifest and tests
        run: |
          docker run --rm -v "$PWD":/src -w /src python:3.13-slim sh -c '
            set -eu
            pip install -q --no-cache-dir ./sdk "./'"$SLUG"'[test]"
            ruff check '"$SLUG"'/src '"$SLUG"'/tests
            mypy '"$SLUG"'/src
            (cd '"$SLUG"' && openmcp-sdk validate connector.yaml)
            python -m pytest '"$SLUG"'/tests -q
          '

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    outputs: { digest: "${{ steps.digest.outputs.digest }}" }
    steps:
      - uses: actions/checkout@v4
        with: { path: "${{ env.SLUG }}" }
      - id: sdkref
        run: echo "ref=$(tr -d '[:space:]' < "${SLUG}/.sdk-ref")" >> "$GITHUB_OUTPUT"
      # Veřejné repo, výchozí `github.token` stačí — viz komentář v jobu `test`.
      - uses: actions/checkout@v4
        with:
          repository: mcp-open/openmcp-sdk
          ref: ${{ steps.sdkref.outputs.ref }}
          path: sdk
      - name: Build and push immutable image
        run: |
          SHA=${GITHUB_SHA::7}
          IMG=localhost:30500/openmcp/mcp-${SLUG}
          docker build -q -f "${SLUG}/Dockerfile" -t "$IMG:dev" -t "$IMG:$SHA" .
          docker push -q "$IMG:$SHA"
          docker push -q "$IMG:dev"
      - name: Smoke test image
        run: |
          TOKEN=$(head -c 48 /dev/urandom | base64 | tr -d '\n')
          cleanup() { docker rm -f "smoke-${SLUG}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "smoke-${SLUG}" -p 18004:8000 \
            -e OPENMCP_MODE=hosted \
            -e OPENMCP_INTERNAL_TOKEN="$TOKEN" \
            -e OPENMCP_PII_SALT=ci-smoke \
            -e VAULT_ADDR=http://127.0.0.1:8200 \
            -e ABRAFLEXI_READ_ONLY=true \
            "localhost:30500/openmcp/mcp-${SLUG}:dev"
          for _ in $(seq 30); do
            curl -sf localhost:18004/healthz && exit 0
            sleep 1
          done
          docker logs "smoke-${SLUG}"
          exit 1
      - id: digest
        run: |
          D=$(docker inspect --format='{{index .RepoDigests 0}}' \
                "localhost:30500/openmcp/mcp-${SLUG}:dev")
          echo "digest=${D#*@}" >> "$GITHUB_OUTPUT"
          echo "**mcp-${SLUG}**: \`${D#*@}\`" >> "$GITHUB_STEP_SUMMARY"

  # Cross-repo dispatch do `mcp-open/platforma` potřebuje token s právem zápisu
  # do cizího repozitáře — `github.token` ho z principu nemá. Když
  # OPENMCP_CI_TOKEN chybí, job se nesmí ani shodit, ani tvářit, že dispatch
  # proběhl: přeskočí ho a nahlásí to do Step Summary jako nedokončený krok
  # k manuálnímu autorizovanému dispatchi.
  record:
    needs: build
    runs-on: self-hosted
    steps:
      - id: gate
        name: Check dispatch authorisation
        env:
          OPENMCP_CI_TOKEN: ${{ secrets.OPENMCP_CI_TOKEN }}
        run: |
          if [ -n "${OPENMCP_CI_TOKEN}" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record candidate digest in platform repository
        if: steps.gate.outputs.authorized == 'true'
        env:
          OPENMCP_CI_TOKEN: ${{ secrets.OPENMCP_CI_TOKEN }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::build nevrátil použitelný digest ('${DIGEST}')"; exit 1 ;;
          esac
          PAYLOAD=$(printf \
            '{"event_type":"component-built","client_payload":{"component":"mcp-%s","digest":"%s"}}' \
            "$SLUG" "$DIGEST")
          RESPONSE_FILE=$(mktemp "${RUNNER_TEMP}/abraflexi-dispatch.XXXXXX")
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${OPENMCP_CI_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mcp-open/platforma/dispatches \
            -d "$PAYLOAD")
          if [ "$CODE" != "204" ]; then
            echo "::error::component-built dispatch selhal (HTTP ${CODE})"
            cat "$RESPONSE_FILE" || true
            {
              echo "### ❌ component-built dispatch SELHAL"
              echo ""
              echo "- komponenta: \`mcp-${SLUG}\`"
              echo "- digest: \`${DIGEST}\`"
              echo "- HTTP: \`${CODE}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "### ✅ component-built dispatch odeslán"
            echo ""
            echo "- cíl: \`mcp-open/platforma\`"
            echo "- komponenta: \`mcp-${SLUG}\`"
            echo "- digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report skipped dispatch
        if: steps.gate.outputs.authorized != 'true'
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "::warning::OPENMCP_CI_TOKEN není nakonfigurován — component-built dispatch NEBYL proveden."
          {
            echo "### ⚠️ component-built dispatch NEBYL proveden"
            echo ""
            echo "Secret \`OPENMCP_CI_TOKEN\` není v tomto repozitáři ani v organizaci"
            echo "dostupný, takže se do \`mcp-open/platforma\` **nic neodeslalo**."
            echo "Image je postavený a pushnutý, ale platforma o kandidátském"
            echo "digestu neví — vyžaduje **manuální autorizovaný dispatch**."
            echo ""
            echo "- komponenta: \`mcp-${SLUG}\`"
            echo "- digest: \`${DIGEST:-<žádný>}\`"
            echo ""
            echo "Manuální krok (z prostředí s oprávněným tokenem):"
            echo ""
            echo '```sh'
            echo 'curl -sS -X POST \'
            echo '  -H "Authorization: Bearer $OPENMCP_CI_TOKEN" \'
            echo '  -H "Accept: application/vnd.github+json" \'
            echo '  https://api.github.com/repos/mcp-open/platforma/dispatches \'
            echo "  -d '{\"event_type\":\"component-built\",\"client_payload\":{\"component\":\"mcp-${SLUG}\",\"digest\":\"${DIGEST:-<digest>}\"}}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

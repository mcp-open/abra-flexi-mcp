[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abraflexi-mcp"
version = "0.1.1"
description = "MCP konektor pro ABRA Flexi (FlexiBee) — účetnictví, faktury, sklad."
requires-python = ">=3.12"
# openmcp-sdk se nepublikuje na PyPI — jméno tam patří nesouvisejícímu
# projektu s nejvyšší verzí 0.2.20, takže `pip install` na tomhle balíku
# selhal a po vydání cizí 0.4.x by nainstaloval cizí kód. Reference míří na
# commit z `.sdk-ref`; shodu hlídá `tests/test_sdk_pin.py`.
#
# Pin je od 31. 7. 2026 zpátky na `main` SDK (0.4.3, FastMCP 3) — dosavadní
# commit žil ve větvi `codex/abraflexi-safe-redirect-20260726` a nikdy se
# nesmergoval. Zpřísnění přesměrování z té větve je v `main` od PR #8
# (`0d36cf1`), takže konektor už si ho nemusí držet sám; hlídá ho
# `tests/test_redirects.py`.
dependencies = [
  "openmcp-sdk @ git+https://github.com/mcp-open/openmcp-sdk@0d36cf1a93c870fe237ecbe3bee7b52b202df18d",
  "fastmcp>=3.2,<4",
  "pydantic>=2.6,<3",
  "httpx>=0.28,<0.29",
  "xmltodict>=0.13,<1",
]

# Deklarované testovací závislosti — `pip install -e '.[test]'` stačí na
# spuštění celé sady lokálně i v CI (bez ad-hoc instalace v run kroku).
[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "anyio>=4,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-xmltodict>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Cache mimo repozitář — DrvFs na Windows disku by ji jinak zanášel do statusu.
cache_dir = "/tmp/.pytest_cache-abraflexi-mcp"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["connector"]

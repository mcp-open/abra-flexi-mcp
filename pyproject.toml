[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abraflexi-mcp"
version = "0.1.0"
description = "MCP konektor pro ABRA Flexi (FlexiBee) — účetnictví, faktury, sklad."
requires-python = ">=3.12"
# openmcp-sdk se nepublikuje na PyPI — jméno tam patří nesouvisejícímu
# projektu s nejvyšší verzí 0.2.20, takže `pip install` na tomhle balíku
# selhal a po vydání cizí 0.4.x by nainstaloval cizí kód. Reference míří na
# commit z `.sdk-ref`; shodu hlídá `tests/test_sdk_pin.py`.
#
# POZOR: tenhle konektor je jako jediný v rodině pořád na SDK 0.4.1
# a FastMCP 2.x. Commit níže žije ve větvi `codex/abraflexi-safe-redirect-20260726`,
# ne v `main` SDK — přechod na 0.4.2 znamená zároveň FastMCP 2 → 3.
dependencies = [
  "openmcp-sdk @ git+https://github.com/mcp-open/openmcp-sdk@35f15e2dbd1e28c220a915ba32d682f525393543",
  "fastmcp>=2.11,<3",
  "pydantic>=2.6,<3",
  "httpx>=0.28,<0.29",
  "xmltodict>=0.13,<1",
]

# Deklarované testovací závislosti — `pip install -e '.[test]'` stačí na
# spuštění celé sady lokálně i v CI (bez ad-hoc instalace v run kroku).
[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "anyio>=4,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Cache mimo repozitář — DrvFs na Windows disku by ji jinak zanášel do statusu.
cache_dir = "/tmp/.pytest_cache-abraflexi-mcp"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["connector"]

# xmltodict nemá typové stuby a je to úzké, dobře ohraničené API — přetypované
# v našem `xml_codec`.
[[tool.mypy.overrides]]
module = "xmltodict"
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────────────────
# connector.yaml — jediný deklarativní zdroj pravdy o konektoru.
#
# Čtou ho DVA přísné parsery a oba musí projít:
#   1. openmcp_sdk.manifest.load_manifest   (runtime, extra="forbid")
#   2. platform/api/internal/provision      (Go, generuje k8s + Vault)
# Ověření obou najednou:  openmcp-sdk validate connector.yaml
# ─────────────────────────────────────────────────────────────────────────────

# Slug je jednoslovný záměrně: `Manifest.env_names()` z něj skládá env
# proměnné bez náhrady pomlček — `abra-flexi` by dal neexportovatelné
# `ABRA-FLEXI_*`. Adresář repozitáře zůstává `abra-flexi-mcp`; build kontext
# ho přejmenovává na slug.
slug: abraflexi
name: ABRA Flexi

# version — musí se shodovat s [project].version v pyproject.toml.
# Hlídá tests/test_packaging.py.
version: 0.1.0

category: ucetnictvi
summary: >
  Čtecí a zapisovací přístup k ABRA Flexi (FlexiBee) — vydané faktury a jejich
  zaúčtování, typy dokladů, účetní deník, přijaté objednávky, skladové pohyby,
  stav skladu a ceník. Zápisy (oprava zaúčtování hlavičky a položek faktury,
  založení skladového pohybu) vyžadují potvrzení uživatele s konkrétním diffem.
  Osobní údaje kontaktů (e-maily, telefony, adresy a bankovní spojení) jsou
  pseudonymizovány na stabilní tokeny; IČ, DIČ a názvy firem zůstávají čitelné.

sdk_min_version: 0.4.0

# ── AUTENTIZACE ──────────────────────────────────────────────────────────────
# ABRA Flexi je per-zákazník instance: URL, firma i uživatel se liší per
# aktivace, tajemství je jen heslo. Env názvy v local-stdio: ABRAFLEXI_<KEY>.
credentials:
  - key: api_url
    label: URL Flexi serveru
    type: string
    secret: false
    required: true
    hint: "Adresa cloudové instance ABRA Flexi včetně portu, např. https://firma.flexibee.eu:5434"
  - key: company
    label: Identifikátor firmy
    type: string
    secret: false
    required: true
    hint: "Kód firmy (databáze) ve Flexi — část URL za /c/, např. firma_s_r_o_1"
  - key: username
    label: Uživatelské jméno
    type: string
    secret: false
    required: true
    hint: "Přihlašovací jméno uživatele Flexi. Doporučujeme vyhrazeného API uživatele s právy podle zamýšleného použití (jen čtení, nebo čtení a zápis)."
  - key: password
    label: Heslo
    type: string
    secret: true
    required: true
    hint: "Heslo uživatele Flexi (ukládá se write-only do trezoru)"

user_config: []

# operator_config — nastavuje provozovatel platformy, ne uživatel.
# `read_only` je speciální: SDK ho čte a podle něj fail-closed odregistruje
# nástroje bez readOnlyHint=True.
operator_config:
  - key: read_only
    label: Pouze čtení
    type: bool
    default: true
    hint: "Zapnuté = registrují se jen čtecí nástroje; zapisovací (oprava zaúčtování, skladové pohyby) se při startu vůbec nenačtou."
  - key: redact_pii
    label: Pseudonymizovat osobní údaje
    type: bool
    default: true
    hint: "Nahradí e-maily, telefony, adresy a bankovní spojení kontaktů stabilními tokeny (<EMAIL_3f9c…>) dřív, než odpověď opustí konektor. IČ, DIČ a názvy firem zůstávají čitelné."
  - key: redact_names
    label: Pseudonymizovat i jména osob
    type: bool
    default: false
    hint: "Tokenizuje i jména kontaktních osob na dokladech. Vyžaduje zapnuté „Pseudonymizovat osobní údaje“."
  - key: require_write_confirmation
    label: Vyžadovat potvrzení zápisu
    type: bool
    default: true
    hint: "Před každým zápisem si konektor vyžádá souhlas uživatele s konkrétním diffem. VYPÍNEJ JEN VĚDOMĚ: potvrzení je jediná vrstva, která zastaví prompt injection z obsahu účetnictví. Vyžaduje klienta s podporou MCP elicitation."

# ── SCHOPNOSTI ───────────────────────────────────────────────────────────────
capabilities:
  default_read_only: true
  supports_write: true
  supports_test: true

# ── VEŘEJNÝ MANIFEST ─────────────────────────────────────────────────────────

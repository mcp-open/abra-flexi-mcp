# ── EGRESS ───────────────────────────────────────────────────────────────────
# Cloudové instance ABRA Flexi běží na portu 5434. Per-zákazník hostname řeší
# wildcard + aplikační validace URL v `client._validated_api_url` (NetworkPolicy
# neumí vynutit FQDN). Self-hosted instance mimo *.flexibee.eu jsou vědomě mimo
# rozsah — viz README.
egress:
  host: "*.flexibee.eu"
  port: 5434
  path_prefix: /c
  methods: [GET, POST, PUT]

# ── PROVISIONING ─────────────────────────────────────────────────────────────
runtime:
  pii_salt: true
  health_path: /healthz
